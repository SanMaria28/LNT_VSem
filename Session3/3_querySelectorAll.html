    <ul>
        <li class="list">Rahul</li>
        <li class="list">Ramesh</li>
        <li class="list">Rohit</li>
    </ul>
    <button type="button" onclick="changeAll()">Highlight Students</button>
    <script>
        function changeAll(){
            let data = document.querySelectorAll('.list');
            data.forEach(function(item){
                item.style.color = "red";
                item.style.backgroundColor = "yellow";
            })
        }
    </script>
