<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type = "button"onclick="colors()"> Color Generator</button>
    <script>
        function colors(){
            let colors = [
                "red",
                "black",
                "green",
                "purple",
                "yellow",
                "brown",
                "blue",
                "orange",
                "pink",
                "grey",
                "maroon"
            ];

            let index= Math.floor(Math.random() * colors.length);
            document.body.style.backgroundColor = colors[index];
        }
    </script>
</body>
</html>
