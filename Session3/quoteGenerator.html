<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
</head>
<body>
    <p id ="quote">Click the button to generate a quote!</p>
    <button type="button" onclick="generateQuote()">Generate Quote</button>

    <script>
        function generateQuote(){
            let quotes = [
                "The best way to predict the future is to invent it. - Alan Kay",
                "Life is 10% what happens to us and 90% how we react to it. - Charles R. Swindoll",
                "The only way to do great work is to love what you do. - Steve Jobs",
                "Success is not final, failure is not fatal: It is the courage to continue that counts. - Winston Churchill",
                "Believe you can and you're halfway there. - Theodore Roosevelt",
                "Don't watch the clock; do what it does. Keep going. - Sam Levenson",
                "The harder I work, the luckier I get. - Gary Player",
                "Your time is limited, so don't waste it living someone else's life. - Steve Jobs",
                "The only limit to our realization of tomorrow will be our doubts of today. - Franklin D. Roosevelt",
                "Do not wait to strike till the iron is hot; but make it hot by striking. - William Butler Yeats"
            ];

            let index = Math.floor(Math.random() * quotes.length);
            document.getElementById("quote").innerText = quotes[index];
            document.getElementById("quote").style.fontStyle = "italic";
            document.getElementById("quote").style.fontSize = "20px";
            document.getElementById("quote").style.color = "blue";

        }
    </script>
</body>
</html>
