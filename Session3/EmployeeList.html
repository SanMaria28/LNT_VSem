<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id ="employeeList">
        <li >Ramesh</li>
        <li >Suresh</li>
        <li >Naresh</li>
    </ul>
    <button type="button" onclick="addEmployee()">Add Employee</button>

    <script>
        function addEmployee(){
            let l = document.createElement('li');
            l.innerText="Mahesh";
            document.getElementById('employeeList').appendChild(l);
        }
    </script>
</body>
</html>
